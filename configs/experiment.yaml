seed: 42
dataset: ../data/synthetic
output_dir: ../results
strategies: [full_context, prefix_cached_full_context, retrieval, compiled_context]
concurrency: [1, 8, 32]
repetitions: 10
warmup_requests: 2
context:
  retrieval:
    method: bm25
    top_k: 8
    chunk_chars: 1200
    overlap_chars: 120
    bm25_k1: 1.5
    bm25_b: 0.75
  tokenizer:
    method: regex
telemetry_interval_s: 1.0
local_gpu_metrics: false
server: &uncached_server
  base_url: http://localhost:8000/v1
  metrics_url: http://localhost:8000/metrics
  model: Qwen/Qwen2.5-7B-Instruct
  model_revision: REPLACE_WITH_MODEL_COMMIT
  vllm_version: REPLACE_WITH_INSTALLED_VERSION
  launch_command: REPLACE_WITH_EXACT_SERVER_COMMAND
  prefix_caching: false
  timeout_s: 120.0
  max_tokens: 256
  structured_output: true
strategy_servers:
  prefix_cached_full_context:
    <<: *uncached_server
    base_url: http://localhost:8001/v1
    metrics_url: http://localhost:8001/metrics
    prefix_caching: true
    launch_command: REPLACE_WITH_CACHE_ENABLED_SERVER_COMMAND
