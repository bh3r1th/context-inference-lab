# Set the three server provenance fields before running against your vLLM endpoint.
seed: 42
dataset: ../data/synthetic
output_dir: ../results
event_ids: [EV-000]
strategies: [full_context]
concurrency: [1]
repetitions: 1
warmup_requests: 0
telemetry_interval_s: 1.0
local_gpu_metrics: false
server:
  base_url: http://localhost:8000/v1
  metrics_url: http://localhost:8000/metrics
  model: Qwen/Qwen2.5-7B-Instruct
  model_revision: a09a35458c702b33eeacc393d103063234e8bc28
  vllm_version: 0.29.0
  launch_command: "vllm serve Qwen/Qwen2.5-7B-Instruct --revision a09a35458c702b33eeacc393d103063234e8bc28 --host 0.0.0.0 --port 8000 --dtype auto --gpu-memory-utilization 0.90 --max-model-len 72K --hf-overrides '{\"rope_parameters\":{\"rope_type\":\"yarn\",\"factor\":4.0,\"original_max_position_embeddings\":32768,\"rope_theta\":1000000.0}}' --generation-config vllm --no-enable-prefix-caching"
  max_tokens: 256
  timeout_s: 120.0
  structured_output: true
  structured_output_mode: vllm
