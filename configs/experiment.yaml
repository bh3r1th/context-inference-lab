seed: 42
dataset: ../data/synthetic
output_dir: ../results
strategies: [full_context, prefix_cached_full_context, retrieval, compiled_context]
concurrency: [1, 8, 32]
repetitions: 10
warmup_requests: 2
context:
  retrieval:
    method: bm25
    top_k: 8
    chunk_chars: 1200
    overlap_chars: 120
    bm25_k1: 1.5
    bm25_b: 0.75
  tokenizer:
    method: regex
telemetry_interval_s: 1.0
local_gpu_metrics: true
server: &uncached_server
  base_url: http://localhost:8000/v1
  metrics_url: http://localhost:8000/metrics
  model: Qwen/Qwen2.5-7B-Instruct
  model_revision: a09a35458c702b33eeacc393d103063234e8bc28
  vllm_version: 0.29.0
  launch_command: "vllm serve Qwen/Qwen2.5-7B-Instruct --revision a09a35458c702b33eeacc393d103063234e8bc28 --host 0.0.0.0 --port 8000 --dtype auto --gpu-memory-utilization 0.90 --max-model-len 72K --rope-scaling '{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768}' --no-enable-prefix-caching"
  prefix_caching: false
  timeout_s: 120.0
  max_tokens: 256
  structured_output: true
strategy_servers:
  prefix_cached_full_context:
    <<: *uncached_server
    base_url: http://localhost:8001/v1
    metrics_url: http://localhost:8001/metrics
    prefix_caching: true
    launch_command: "vllm serve Qwen/Qwen2.5-7B-Instruct --revision a09a35458c702b33eeacc393d103063234e8bc28 --host 0.0.0.0 --port 8000 --dtype auto --gpu-memory-utilization 0.90 --max-model-len 72K --rope-scaling '{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768}' --enable-prefix-caching"
