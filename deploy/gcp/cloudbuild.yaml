steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --file=deploy/gcp/Dockerfile
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
logsBucket: gs://context-inference-lab
options:
  logging: GCS_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
