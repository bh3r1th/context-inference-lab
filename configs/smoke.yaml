# Set the three server provenance fields before running against your vLLM endpoint.
seed: 42
dataset: ../data/synthetic
output_dir: ../results
event_ids: [EV-000]
strategies: [full_context]
concurrency: [1]
repetitions: 1
warmup_requests: 0
telemetry_interval_s: 1.0
local_gpu_metrics: false
server:
  base_url: http://localhost:8000/v1
  metrics_url: http://localhost:8000/metrics
  model: Qwen/Qwen2.5-7B-Instruct
  model_revision: REPLACE_WITH_MODEL_COMMIT
  vllm_version: REPLACE_WITH_INSTALLED_VERSION
  launch_command: REPLACE_WITH_EXACT_SERVER_COMMAND
  max_tokens: 256
  timeout_s: 120.0
  structured_output: true
  structured_output_mode: vllm
